[pytest]
# J.A.R.V.I.S Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require external services)
    slow: Slow running tests (may take > 1 minute)
    security: Security-related tests
    audio: Audio processing tests
    llm: LLM-related tests
    network: Tests requiring network access

# Minimum version
minversion = 6.0

# Test session configuration
asyncio_mode = auto

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage configuration (when used with pytest-cov)
# Coverage settings are already included in the main addopts or passed via CLI

# Parallel execution (when used with pytest-xdist)
# addopts = -n auto

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:pkg_resources is deprecated as an API.*:UserWarning
    ignore::UserWarning:livekit.*
    ignore::UserWarning:google.*

# Timeout configuration (when used with pytest-timeout)
timeout = 300
timeout_method = thread
