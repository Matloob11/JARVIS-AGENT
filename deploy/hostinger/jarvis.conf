# JARVIS HTTPS reverse proxy — Hostinger VPS
# New site only; do not edit any other site's config on this server.
# Install: copy to /etc/nginx/conf.d/jarvis.conf then certbot + nginx -t && reload

# Browsers repeat the site's basic-auth credentials on every request to this host, including the
# LiveKit websocket. LiveKit rejects any Authorization header that is not "Bearer" (401), so Basic
# credentials are dropped on the LiveKit location only; Bearer headers pass unchanged.
map $http_authorization $jarvis_livekit_authorization {
    ~*^Basic\s  "";
    default     $http_authorization;
}

# HTTP → HTTPS redirect + ACME
server {
    listen 80;
    listen [::]:80;
    server_name jarvis.srv1802669.hstgr.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jarvis.srv1802669.hstgr.cloud;

    # Filled by certbot (or use ssl_certificate directives after first cert)
    ssl_certificate     /etc/letsencrypt/live/jarvis.srv1802669.hstgr.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.srv1802669.hstgr.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (Docker jarvis-frontend :5100)
    # TEMPORARY (emergency, 2026-09-30): browser password on the UI until the real
    # login screen (plan OPS-08/OPS-C1) is live. /vortex/ and /rtc stay token-protected.
    location / {
        auth_basic "JARVIS";
        auth_basic_user_file /etc/nginx/jarvis.htpasswd;
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bridge API + Socket.IO (Docker jarvis-bridge :5101)
    location /vortex/ {
        proxy_pass http://127.0.0.1:5101/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # LiveKit signaling — client URL is wss://host (paths /rtc stay /rtc on backend)
    location /rtc {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Authorization $jarvis_livekit_authorization;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }
}
