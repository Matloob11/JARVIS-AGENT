[tool.ruff]
# Target Python version
target-version = "py311"

# Exclude directories that contain debug, profiling, or temporary tools
exclude = [
    ".git",
    ".github",
    ".pytest_cache",
    ".venv",
    ".venv_312",
    ".agent",
    "chroma_db",
    "pretrained_models",
    "scripts/debug",
    "scripts/profiling",
    "scripts/tools",
    "tests",
    "debug",
    "dev_tools",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
# ULTRA-STRICT: Enable extensive rules for security, performance, and best practices
select = [
    "F",     # Pyflakes
    "E",     # Error
    "W",     # Warning
    "I",     # Isort (Import sorting)
    "N",     # PEP8 Naming
    "UP",    # Pyupgrade
    "ASYNC", # Asyncio checks
    "S",     # Security checks (bandit)
    "B",     # Bugbear (potential bugs)
    "A",     # Built-ins (prevent shadowing)
    "COM",   # Commas
    "C4",    # Comprehensions
    "DTZ",   # Datetime/Timezones
    "T20",   # Print statements
    "RET",   # Return style
    "SIM",   # Simplify
    "ARG",   # Unused arguments
    "PTH",   # Pathlib
    "ERA",   # Eradicate (commented out code)
    "PL",    # Pylint rules
    "PERF",  # Performance
    "RUF"    # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"services/ai_core/voice_fingerprint.py" = ["E402"]
