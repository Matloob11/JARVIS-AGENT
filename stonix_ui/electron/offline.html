<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS — VPS unreachable</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 20%, #1a2744 0%, #06080f 55%);
        color: #e8eefc;
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        opacity: 0.85;
        line-height: 1.5;
      }
      button {
        cursor: pointer;
        border: 1px solid #3d5a8a;
        background: #152238;
        color: inherit;
        padding: 0.65rem 1.25rem;
        border-radius: 0.5rem;
        font-size: 0.95rem;
      }
      button:hover {
        background: #1c2d4d;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>VPS unreachable — Retry</h1>
      <p>JARVIS dashboard abhi load nahi ho saka. Internet ya server check karein, phir dubara try karein.</p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => {
        if (window.electronAPI && typeof window.electronAPI.retryMainLoad === 'function') {
          window.electronAPI.retryMainLoad();
        } else {
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
